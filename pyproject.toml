[project]
name = "battlecode-bot"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = [
    "pyright",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pyright]
extraPaths = ["sdk/python"]
# bots run as scripts, so sibling imports like `import draft` are intended
reportImplicitRelativeImport = false

[tool.ruff]
# sdk/ and the *.md docs are vendored by `cambc init`; don't restyle them
extend-exclude = ["sdk", "*.md"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import sorting, modern syntax, bugbear, simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]
# the formatter handles line length; long comments are left alone
ignore = ["E501"]
