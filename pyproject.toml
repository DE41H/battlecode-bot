[project]
name = "battlecode-bot"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = ["pyright"]

[tool.uv]
package = false

[tool.pyright]
extraPaths = ["sdk/python"]
# bots run as scripts, so sibling imports like `import draft` are intended
reportImplicitRelativeImport = false
