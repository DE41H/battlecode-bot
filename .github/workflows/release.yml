name: Build & Release

on:
  push:
    branches: ["main"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install Cambc
        run: uv tool install cambc

      - name: Build & Bundle
        run: |
          mkdir -p dist
          for dir in bots/*/; do
            bot=$(basename "$dir")
            echo "Building $bot..."
            cambc build "$bot"
            cambc bundle "$bot" --output "dist/$bot.zip"
          done

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/*.zip \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }} (${GITHUB_REF_NAME})" \
            --notes "Commit ${{ github.sha }}"
